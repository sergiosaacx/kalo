<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Sin zoom: ni pellizcando ni con doble toque -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Kalo</title>
    <!-- PWA: se instala desde Safari con Compartir → Agregar a inicio -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kalo" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0B0B0C;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Instalada en el iPhone: el alto lo da la pantalla real (ver el script de abajo) */
      html.instalada, html.instalada body, html.instalada #root { height: var(--alto, 100%); }
      /* Fuente del handoff para todo el texto */
      #root, #root * {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      /* Sin zoom por doble toque */
      html, body, #root { touch-action: manipulation; }
      /* Safari pinta de amarillo los campos que autocompleta: se dejan con los colores de Kalo */
      input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
        -webkit-text-fill-color: #F4F2EF;
        caret-color: #F4F2EF;
        -webkit-box-shadow: 0 0 0 1000px #212125 inset;
        box-shadow: 0 0 0 1000px #212125 inset;
        transition: background-color 9999s ease-out 0s;
      }
      /* Con letra de menos de 16 px el iPhone se acerca solo al escribir */
      input, textarea { font-size: 16px !important; }
    </style>
    <script>
      // Safari en iPhone ignora user-scalable=no: se bloquea el pellizco a mano
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
      // iOS 26 (p. ej. iPhone 16 Pro), con Kalo instalada en inicio, reporta una ventana más bajita que la
      // pantalla y la barra de pestañas queda flotando con un hueco negro abajo. Instalada, Kalo ocupa
      // toda la pantalla: se usa el alto real de la pantalla si la ventana dice menos.
      (function () {
        var instalada = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        // Solo iPhone/iPad: en Android la «pantalla» incluye las barras del sistema y la app quedaría más alta que la ventana
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!instalada || !ios) return;
        var raiz = document.documentElement;
        raiz.classList.add('instalada');
        // ¿La app va detrás de la franja de la hora? (margen seguro de arriba > 0). En iOS 26.1 (iPhone 13 Pro Max)
        // la app empieza debajo de la hora, el margen de arriba es 0 y la ventana ya es el alto real: no se estira.
        function margenArriba() {
          var sonda = document.createElement('div');
          sonda.style.cssText = 'position:fixed;top:0;left:0;width:0;visibility:hidden;padding-top:env(safe-area-inset-top)';
          raiz.appendChild(sonda);
          var m = parseFloat(getComputedStyle(sonda).paddingTop) || 0;
          raiz.removeChild(sonda);
          return m;
        }
        function ajustar() {
          var alto = window.innerHeight;
          var vertical = window.innerHeight >= window.innerWidth;
          var pantalla = vertical ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          if (pantalla > alto + 1 && margenArriba() > 0) alto = pantalla;
          raiz.style.setProperty('--alto', alto + 'px');
        }
        ajustar();
        window.addEventListener('resize', ajustar);
        window.addEventListener('orientationchange', function () { setTimeout(ajustar, 300); });
      })();
    </script>
  </head>

  <body>
    <noscript>Kalo necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
